name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: janella
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d janella"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/janella?schema=public
      NODE_ENV: test
      RUN_EMBEDDING_DB_TESTS: "1"
      RUN_EMBEDDING_CONCURRENCY_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Prove regressions fail on pre-fix source
        run: |
          for file in lib/search.ts lib/actions.ts components/recipe/ingredient-list.tsx components/recipe/instruction-steps.tsx; do
            cp "$file" "$RUNNER_TEMP/$(basename "$file")"
            git show 88a692b:"$file" > "$file"
          done
          failed=0
          for suite in tests/search-pagination.test.ts tests/recipe-timing.test.ts tests/components/recipe-groups.test.tsx; do
            if pnpm exec vitest run "$suite"; then
              echo "Regression unexpectedly passed on baseline: $suite"
              failed=1
            fi
          done
          for file in lib/search.ts lib/actions.ts components/recipe/ingredient-list.tsx components/recipe/instruction-steps.tsx; do
            cp "$RUNNER_TEMP/$(basename "$file")" "$file"
          done
          exit "$failed"

      - name: Sync database schema
        run: pnpm run db:push

      - parallel:
          - name: Lint
            run: pnpm lint

          - name: Typecheck
            run: pnpm run typecheck

          - name: Test Vitest suites
            run: pnpm run test

          - name: Build
            run: pnpm run build
