name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type check
        run: npx tsc --noEmit

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for Vercel Preview URL
        id: vercel_preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          MAX_ATTEMPTS=30
          INTERVAL=10

          echo "Waiting for Vercel deployment for commit $SHA ..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            # Fetch deployments for this commit SHA
            DEPLOY_URL=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=10" \
              --jq '
                [ .[] | select(.environment | test("Preview";"i")) ] | first | .id
              ' 2>/dev/null || true)

            if [ -n "$DEPLOY_URL" ] && [ "$DEPLOY_URL" != "null" ]; then
              # Found a deployment — check its latest status
              STATUS_JSON=$(gh api "repos/$REPO/deployments/$DEPLOY_URL/statuses?per_page=1" \
                --jq 'first' 2>/dev/null || true)
              STATE=$(echo "$STATUS_JSON" | jq -r '.state // empty')
              TARGET=$(echo "$STATUS_JSON" | jq -r '.environment_url // .target_url // empty')

              if [ "$STATE" = "success" ] && [ -n "$TARGET" ]; then
                echo "Vercel preview ready: $TARGET"
                echo "url=$TARGET" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Attempt $i/$MAX_ATTEMPTS — deployment found, state=$STATE. Waiting ${INTERVAL}s..."
            else
              echo "Attempt $i/$MAX_ATTEMPTS — no deployment yet. Waiting ${INTERVAL}s..."
            fi

            sleep "$INTERVAL"
          done

          echo "::error::Timed out waiting for Vercel preview deployment"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel_preview.outputs.url }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
