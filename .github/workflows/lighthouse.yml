name: Lighthouse CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: janella
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d janella"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/janella?schema=public
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync database schema
        run: pnpm run db:push

      - name: Build app
        run: pnpm run build

      - name: Start app
        run: pnpm run start > /tmp/next-start.log 2>&1 &

      - name: Wait for app to be ready
        run: |
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start in time."
          tail -n 200 /tmp/next-start.log || true
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:3000/
            http://127.0.0.1:3000/recipes
            http://127.0.0.1:3000/search?q=pasta
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload app logs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: next-start-log
          path: /tmp/next-start.log
          retention-days: 7
