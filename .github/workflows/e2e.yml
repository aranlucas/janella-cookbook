name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Optional Janella Vercel URL to test instead of the isolated app"
        type: string
        required: false

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.deployment.id || github.ref }}-${{ github.event.deployment_status.state || 'tests' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ (github.event_name != 'deployment_status' && !inputs.deployment_url) && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: janella_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d janella_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/janella_e2e?schema=public

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Test deployment authentication
        run: pnpm test:deployment-auth

      - name: Initialize isolated test database
        run: pnpm run db:push

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Install e2e engine browser
        run: pnpm exec e2e-web install chromium --with-deps

      - name: Prove browser regressions fail on pre-fix source
        run: |
          cp components/forms/manual-recipe-form.tsx "$RUNNER_TEMP/manual-recipe-form.tsx"
          git show 88a692b:components/forms/manual-recipe-form.tsx > components/forms/manual-recipe-form.tsx
          cp app/recipes/page.tsx "$RUNNER_TEMP/recipes-page.tsx"
          cp components/chatbot/chat-interface.tsx "$RUNNER_TEMP/chat-interface.tsx"
          git show 88a692b:app/recipes/page.tsx > app/recipes/page.tsx
          git show 88a692b:components/chatbot/chat-interface.tsx > components/chatbot/chat-interface.tsx
          pnpm run build
          failed=0
          for behavior in "chat accepts step" "chat shares granted"; do
            if pnpm exec playwright test e2e/reliability.spec.ts --grep "$behavior" --retries=0; then
              echo "Regression unexpectedly passed on baseline: $behavior"
              failed=1
            fi
          done
          for behavior in "save, reopen" "cleared preparation"; do
            result=0
            pnpm exec e2e run --grep "$behavior" || result=$?
            if [[ "$result" != "1" ]]; then
              echo "Expected assertion failure (exit 1), got $result: $behavior"
              failed=1
            fi
          done
          cp "$RUNNER_TEMP/manual-recipe-form.tsx" components/forms/manual-recipe-form.tsx
          cp "$RUNNER_TEMP/recipes-page.tsx" app/recipes/page.tsx
          cp "$RUNNER_TEMP/chat-interface.tsx" components/chatbot/chat-interface.tsx
          exit "$failed"

      - name: Build fixed app
        run: pnpm run build

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Run deterministic recipe journey
        run: pnpm exec e2e run

      - name: Upload e2e evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-recipe-journey
          path: .e2e/
          include-hidden-files: true
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deployment-e2e:
    if: >-
      ((github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.creator.login == 'vercel[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_url != '')) && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only same-repository branch tips may supply test code with credentials.
      # Fork deployments and superseded commits use the trusted main suite.
      - name: Select trusted test source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.deployment.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ref="$SOURCE_SHA"
          if [[ "$EVENT_NAME" == "deployment_status" ]]; then
            count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/branches-where-head" --jq length)"
            if [[ "$count" == "0" ]]; then
              ref="main"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Test deployed app
        run: pnpm test:e2e:deployment
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.deployment_url || github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Remove deployment session
        if: always()
        run: rm -f playwright/.cache/deployment.json

      - name: Upload deployment results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-deployment-results
          path: |
            playwright-deployment-report/
            test-results/
          retention-days: 14
