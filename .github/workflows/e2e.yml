name: E2E Tests

on:
  # Fired by Vercel via repository_dispatch after deployment status changes
  repository_dispatch:
    types:
      - "vercel.deployment.success"

  # Fired by GitHub when Vercel updates a deployment status
  deployment_status:

  # Allow manual trigger with a custom URL
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Deployment URL to test against"
        required: true
        type: string

concurrency:
  group: e2e-${{ github.event.client_payload.git.sha || github.event.deployment.sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    # Only run when:
    # - repository_dispatch: always (already filtered to success)
    # - deployment_status: only on success
    # - workflow_dispatch: always
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Determine base URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${{ inputs.deployment_url }}"
          elif [ "${{ github.event_name }}" = "deployment_status" ]; then
            URL="${{ github.event.deployment_status.environment_url }}"
            if [ -z "$URL" ]; then
              URL="${{ github.event.deployment_status.target_url }}"
            fi
          else
            URL="${{ github.event.client_payload.url }}"
          fi

          echo "Event: ${{ github.event_name }}"
          echo "URL:   $URL"

          if [ -z "$URL" ]; then
            echo "::error::No deployment URL found"
            exit 1
          fi

          echo "base_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.url.outputs.base_url }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
