name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Optional Janella Vercel URL to test instead of the isolated app"
        type: string
        required: false

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.deployment.id || github.ref }}-${{ github.event.deployment_status.state || 'tests' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'deployment_status' && !inputs.deployment_url
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: janella_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d janella_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/janella_e2e?schema=public

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test deployment authentication
        run: pnpm test:deployment-auth

      - name: Initialize isolated test database
        run: pnpm run db:push

      - name: Build app
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deployment-e2e:
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.creator.login == 'vercel[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only same-repository branch tips may supply test code with credentials.
      # Fork deployments and superseded commits use the trusted main suite.
      - name: Select trusted test source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.deployment.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ref="$SOURCE_SHA"
          if [[ "$EVENT_NAME" == "deployment_status" ]]; then
            count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/branches-where-head" --jq length)"
            if [[ "$count" == "0" ]]; then
              ref="main"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Test deployed app
        run: pnpm test:e2e:deployment
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.deployment_url || github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Remove deployment session
        if: always()
        run: rm -f playwright/.cache/deployment.json

      - name: Upload deployment results
        uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-deployment-results
          path: |
            playwright-deployment-report/
            test-results/
          retention-days: 14
