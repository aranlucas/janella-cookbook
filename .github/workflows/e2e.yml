name: E2E Tests

on:
  # Fired by Vercel's GitHub integration after a successful preview deployment
  repository_dispatch:
    types:
      - "vercel.deployment.success"

  # Allow manual trigger with a custom URL
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Deployment URL to test against"
        required: true
        type: string

concurrency:
  group: e2e-${{ github.event.client_payload.git.sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Determine base URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "base_url=${{ inputs.deployment_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=${{ github.event.client_payload.url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for deployment to be ready
        run: |
          URL="${{ steps.url.outputs.base_url }}"
          echo "Testing against: $URL"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$URL"; then
              echo "Deployment is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 10s..."
            sleep 10
          done
          echo "Deployment did not become ready in time"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.url.outputs.base_url }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
