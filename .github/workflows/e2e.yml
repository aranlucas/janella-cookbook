name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

  # Allow manual trigger with a custom URL
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Deployment URL to test against (skips Vercel deploy step)"
        required: false
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Deploy to Vercel Preview
        id: vercel
        if: ${{ !inputs.deployment_url }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: false

      - name: Determine base URL
        id: url
        run: |
          if [ -n "${{ inputs.deployment_url }}" ]; then
            echo "base_url=${{ inputs.deployment_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=${{ steps.vercel.outputs.preview-url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for deployment to be ready
        run: |
          URL="${{ steps.url.outputs.base_url }}"
          echo "Waiting for $URL to be reachable..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$URL"; then
              echo "Deployment is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 10s..."
            sleep 10
          done
          echo "Deployment did not become ready in time"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.url.outputs.base_url }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
